name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Bilingual documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bengali and English documentation
        run: python3 tools/validate-docs.py
      - name: Prove that missing or outdated translations fail the check
        run: bash tests/docs-validator.sh

  lint:
    name: Shell lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          for file in ready-fast install.sh lib/common.sh scripts/*.sh tests/*.sh; do
            bash -n "$file"
          done
      - name: shellcheck
        run: shellcheck ready-fast install.sh lib/common.sh scripts/*.sh tests/*.sh
      - name: Python syntax check
        run: python3 -m py_compile tools/validate-docs.py

  smoke:
    name: Smoke tests (Ubuntu VM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests as a normal user
        run: bash tests/smoke.sh
      - name: Smoke tests as root
        run: sudo bash tests/smoke.sh

  containers:
    name: System tests (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:12
          - debian:13
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Smoke tests
        run: bash tests/smoke.sh
      - name: System tests (real Docker installation, SSH hardening and rollback)
        env:
          READY_FAST_TEST_SYSTEM: "1"
        run: bash tests/system.sh

  vm:
    name: System tests with systemd (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System tests (SSH service reload and real firewall)
        run: sudo env READY_FAST_TEST_SYSTEM=1 READY_FAST_TEST_SKIP_DOCKER=1 bash tests/system.sh
